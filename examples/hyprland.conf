# Bind SUPER+G to open the gitwatch rofi picker.
bind = SUPER, G, exec, ~/.config/waybar/scripts/rofi-gitmenu.sh

# Optional: a periodic background sync of every repo, then refresh Waybar.
# (Put the loop in a systemd user timer or a Hyprland exec-once instead if
#  you prefer; this is just an illustration.)
# exec-once = for d in $HOME/dev/*/; do gitwatch sync "$d"; done; pkill -RTMIN+8 waybar
