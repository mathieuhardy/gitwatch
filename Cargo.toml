[package]
name = "gitwatch"
version = "0.1.0"
edition = "2021"
description = "Monitor a directory of git repos for Waybar/rofi and auto-sync with conflict handling"

[[bin]]
name = "gitwatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
gethostname = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
